<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>강 건너기 퍼즐</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#35404d;font-family:Arial,sans-serif;background:linear-gradient(#c9f3ff,#effcff,#c9f3ff);min-height:100vh}header{padding:18px;color:#fff;text-align:center;background:linear-gradient(100deg,#07906f,#0b9f91)}h1{margin:0;font-size:clamp(26px,3vw,38px)}header p{margin:7px 0 0}.game{width:min(1480px,calc(100% - 32px));margin:18px auto}.status{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:12px;padding:15px 20px;background:#fffffff0;border-radius:18px;box-shadow:0 6px 18px #157fa330;font-size:18px}.msg{text-align:center;font-weight:bold;background:#f1f3f5;border-radius:20px;padding:9px}.reset{justify-self:end;border:0;border-radius:25px;background:#ff6f0e;color:#fff;padding:12px 22px;font-weight:bold;cursor:pointer}.world{display:grid;grid-template-columns:1fr 2fr 1fr;min-height:560px;margin-top:18px;border-radius:22px;overflow:hidden}.bank,.river{position:relative}.bank{padding:60px 18px 20px;background:linear-gradient(135deg,#1bc252,#0fa042)}.right{background:linear-gradient(135deg,#10aa44,#108b3b)}.label{position:absolute;top:14px;left:14px;background:#e9ffeadd;color:#168247;border-radius:18px;padding:7px 12px;font-weight:bold}.right .label{left:auto;right:14px}.chars{height:100%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:12px}.char{width:92px;height:92px;border:3px solid transparent;border-radius:16px;background:#effff0e8;cursor:pointer;font-weight:bold}.char b{display:block;font-size:42px}.char.on{border-color:#ffb000;transform:translateY(-5px);box-shadow:0 0 0 4px #fff6}.river{background:linear-gradient(#0a9ed7,#0879b6);overflow:hidden}.river:before{content:"🌊";position:absolute;top:22px;left:48%;font-size:42px;opacity:.45}.river:after{content:"🌊";position:absolute;bottom:22px;left:48%;font-size:42px;opacity:.45}.boat{position:absolute;top:46%;border:0;background:0;color:#fff;cursor:pointer;transition:.5s}.boat[data-side=left]{left:13%}.boat[data-side=right]{right:13%}.boat b{display:block;font-size:66px}.boat small{background:#17699ad9;padding:6px 9px;border-radius:5px;font-weight:bold}.rules{margin-top:18px;padding:16px 22px;background:#fffffff0;border-radius:18px}.rules h3{text-align:center;margin:0 0 12px}.rules div{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rules p{margin:0;padding:14px;background:#fff0f2;border-radius:9px}.rules p:first-child{background:#fffce8}@media(max-width:700px){.game{width:calc(100% - 18px)}.status{grid-template-columns:1fr auto;font-size:14px}.msg{grid-column:1/-1;grid-row:2}.world{grid-template-columns:1fr 1.4fr 1fr;min-height:500px}.bank{padding:52px 5px 12px}.char{width:68px;height:74px}.char b{font-size:32px}.char small{font-size:11px}.boat b{font-size:50px}.rules div{grid-template-columns:1fr}}
</style></head><body><header><h1>🌊 강 건너기 퍼즐 🌊</h1><p>농부가 늑대, 양, 양배추를 안전하게 건너편으로 옮겨주세요!</p></header>
<main class="game"><section class="status"><strong>🚣 이동 횟수: <i id="moves">0</i></strong><span class="msg" id="msg">캐릭터를 선택하고 배를 클릭하세요!</span><button class="reset" onclick="reset()">↩ 다시하기</button></section>
<section class="world"><div class="bank"><span class="label">이쪽 강변</span><div class="chars" id="left"></div></div><div class="river"><button class="boat" id="boat" data-side="left" onclick="cross()"><b>🛶</b><small>클릭하여 이동</small></button></div><div class="bank right"><span class="label">건너편 🎯</span><div class="chars" id="right"></div></div></section>
<section class="rules"><h3>📜 규칙</h3><div><p>👨‍🌾 농부는 한 번에 하나만 태울 수 있어요</p><p>🐺🐑 농부 없이 늑대와 양이 있으면 위험!</p><p>🐑🥬 농부 없이 양과 양배추가 있으면 위험!</p></div></section></main>
<script>
const data={farmer:["👨‍🌾","농부"],wolf:["🐺","늑대"],sheep:["🐑","양"],cabbage:["🥬","양배추"]};let pos,selected,moves,ended;
function render(){for(const side of["left","right"]){const box=document.getElementById(side);box.innerHTML="";Object.keys(data).filter(k=>pos[k]===side).forEach(k=>{const b=document.createElement("button");b.className="char"+(selected===k?" on":"");b.innerHTML="<b>"+data[k][0]+"</b><small>"+data[k][1]+"</small>";b.onclick=()=>select(k);box.appendChild(b)})}document.getElementById("moves").textContent=moves;document.getElementById("boat").dataset.side=pos.farmer}
function say(t){document.getElementById("msg").textContent=t}function select(k){if(ended)return;if(pos[k]!==pos.farmer)return say("배와 같은 강변에 있는 캐릭터를 선택하세요!");selected=selected===k?null:k;say(k==="farmer"?"농부 혼자 이동하려면 배를 클릭하세요!":data[k][1]+"을(를) 태웠어요. 배를 클릭하세요!");render()}
function cross(){if(ended)return;const to=pos.farmer==="left"?"right":"left";pos.farmer=to;if(selected&&selected!=="farmer")pos[selected]=to;selected=null;moves++;render();const empty=to==="left"?"right":"left";if(pos.wolf===empty&&pos.sheep===empty)return lose("농부가 없는 사이 늑대가 양을 잡아먹었어요!");if(pos.sheep===empty&&pos.cabbage===empty)return lose("농부가 없는 사이 양이 양배추를 먹었어요!");if(Object.values(pos).every(v=>v==="right")){ended=true;say("🎉 성공! "+moves+"번 만에 모두 안전하게 건넜어요!")}else say("안전해요! 다음 캐릭터를 선택하세요.")}
function lose(t){ended=true;say("💥 "+t)}function reset(){pos={farmer:"left",wolf:"left",sheep:"left",cabbage:"left"};selected=null;moves=0;ended=false;say("캐릭터를 선택하고 배를 클릭하세요!");render()}reset();
</script></body></html>
